<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linux Final Review — 25 Questions</title>
<style>
:root{--bg:#0f172a;--card:#111827;--choice:#1f2937;--border:#334155;--text:#f8fafc;--muted:#94a3b8;--blue:#3b82f6;--green:#14532d;--red:#7f1d1d}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#0f172a,#111827);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:920px;margin:auto;padding:18px}
header{position:sticky;top:0;z-index:10;background:#0f172af2;border-bottom:1px solid var(--border);backdrop-filter:blur(8px)}
h1{margin:0 0 6px;font-size:1.45rem}
.meta{color:var(--muted)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ctrl{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.primary{background:var(--blue);color:#fff}.secondary{background:#334155;color:#fff}
.score{margin-left:auto;font-weight:700}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin:15px 0}
.qnum{color:#60a5fa;font-size:.85rem;font-weight:700}
.question{font-size:1.05rem;line-height:1.45;margin:9px 0 12px}
.choice{display:block;width:100%;text-align:left;background:var(--choice);color:#fff;border:1px solid #475569;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}
.choice.selected{outline:2px solid var(--blue)}
.choice.correct{background:var(--green);border-color:#22c55e}
.choice.wrong{background:var(--red);border-color:#ef4444}
#result{display:none;background:#172554;border:1px solid #1d4ed8;border-radius:12px;padding:14px;margin-top:16px;font-weight:700}
@media(max-width:600px){.score{width:100%;margin-left:0}}
</style>
</head>
<body>
<header>
<div class="wrap">
<h1>Linux Final Review</h1>
<div class="meta">25 questions • Original wording and provided answers preserved</div>
<div class="controls">
<button class="ctrl primary" id="gradeBtn">Grade Quiz</button>
<button class="ctrl secondary" id="resetBtn">Retake</button>
<label><input id="studyMode" type="checkbox"> Study mode</label>
<span class="score" id="scoreText">Score: —</span>
</div>
</div>
</header>
<main class="wrap">
<div id="result"></div>
<div id="quiz"></div>
</main>
<script>
const QUESTIONS=[{"q": "What command is used to identify the running OS in verbose output?", "options": ["uname -srv", "hostnamectl", "cat /etc/os-release", "uname -a"], "answer": 0}, {"q": "What is the innermost operating mode level where executing code has full unrestricted access to the hardware?", "options": ["User - Ring 3", "Kernel - Ring 1", "Supervisor - Ring 2", "Kernel - Ring 0"], "answer": 3}, {"q": "At what run-level reboots the system?", "options": ["Run level 6", "Run level 5", "Run level 1", "Run level 0"], "answer": 0}, {"q": "If I wanted to run my operating system in multi-user mode what is the lowest level I can use?", "options": ["Run level 1", "Run level 0", "Run level 2", "Run level 3"], "answer": 2}, {"q": "What command would I use to display the current working directory?", "options": ["cd", "ls", "whereis", "pwd"], "answer": 3}, {"q": "In what phase of the linux boot process does the POST run?", "options": ["BIOS Linux boot process phase (Phase 1)", "Kernel phase (Phase 3)", "Init phase (Phase 4)", "Boot loader phase (Phase 2)"], "answer": 0}, {"q": "What command would I use to determine my current shell environment?", "options": ["printenv USER", "echo $SHELL", "shell --current", "env $SHELL"], "answer": 1}, {"q": "In what directory would I place a shell script to allow everyone to run it?", "options": ["/var/local/bin", "/etc/scripts", "/usr/local/bin", "/home/user/bin"], "answer": 2}, {"q": "On what Linux OS layer performs privileged tasks on behalf of a calling process?", "options": ["Kernel layer - Ring 0", "Application layer - Ring 1", "Shell layer - Ring 2", "User layer - Ring 3"], "answer": 0}, {"q": "What command would I use to check consistency of the file system?", "options": ["fdisk", "fsck", "chkfs", "mount"], "answer": 1}, {"q": "If I was changing file permissions with chmod 755 for a script, who would be able to use the script?", "options": ["Root only", "Owner and group only", "Everyone", "Owner only"], "answer": 2}, {"q": "What is the primary purpose of a CRON tab?", "options": ["Mounting file systems", "Managing user passwords", "Configuring network interfaces", "Specifying shell commands to be run"], "answer": 3}, {"q": "The directory location where user individual CRON tab files are stored?", "options": ["/etc/crontab", "/var/spool/cron", "/usr/local/cron", "/home/usr/.crontab"], "answer": 3}, {"q": "What critical subdirectory file contains basic user and account information?", "options": ["/etc/passwd", "/etc/profile", "/etc/shadow", "/etc/group"], "answer": 0}, {"q": "If I want to change directories how do I do it?", "options": ["pwd", "mv", "cd", "ls"], "answer": 2}, {"q": "The critical directory containing commands and critical configuration files for users.", "options": ["/bin", "/var", "/etc", "/usr"], "answer": 2}, {"q": "When working with CentOS and RedOS Linux what is contained in /tmp folder?", "options": ["Temporary files used by the system", "Kernel modules", "Permanent user files", "System boot files"], "answer": 0}, {"q": "What character spaces indicate owner file permissions?", "options": ["8-10", "2-4", "1-3", "5-7"], "answer": 1}, {"q": "What command would I use to modify default permission settings?", "options": ["chown", "umask", "chmod", "setfacl"], "answer": 1}, {"q": "What file contains user password information and password aging?", "options": ["/etc/passwd", "/etc/group", "/etc/shadow!!!!!!!!!", "/etc/security"], "answer": 2}, {"q": "If I want to delete a user account what command do I use?", "options": ["userremove", "rmuser", "deluseradd", "userdel"], "answer": 3}, {"q": "This user associated file contains both authentication and authorization information?", "options": ["/etc/group", "/etc/passwd", "/etc/sudoers", "/etc/shadow"], "answer": 1}, {"q": "What flag when having a group for a user modifies the users supplementary group membership?", "options": ["-g", "-G", "-s", "-m"], "answer": 1}, {"q": "If I wanted to createa a backup or tape archive what command would I use?", "options": ["gzip", "dd", "tar", "cpio"], "answer": 2}, {"q": "tar -tvf /dev/mt0 command what would I be allowed to view?", "options": ["I want to view the contents of the tape.", "I want to extract the tape.", "I want to erase the tape.", "I want to create a new tape archive."], "answer": 0}];
let state=[];

function esc(s){
  return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function resetQuiz(){
  state=QUESTIONS.map(()=>({selected:null,revealed:false}));
  scoreText.textContent='Score: —';
  result.style.display='none';
  render();
}

function render(){
  quiz.innerHTML='';
  QUESTIONS.forEach((q,qi)=>{
    const card=document.createElement('section');
    card.className='card';
    card.innerHTML=`<div class="qnum">Question ${qi+1}</div><div class="question">${esc(q.q)}</div>`;
    q.options.forEach((opt,oi)=>{
      const button=document.createElement('button');
      button.type='button';
      button.className='choice';
      button.textContent=String.fromCharCode(65+oi)+'. '+opt;
      if(state[qi].selected===oi) button.classList.add('selected');
      if(state[qi].revealed){
        if(oi===q.answer) button.classList.add('correct');
        else if(state[qi].selected===oi) button.classList.add('wrong');
      }
      button.onclick=()=>{
        state[qi].selected=oi;
        if(studyMode.checked) state[qi].revealed=true;
        render();
      };
      card.appendChild(button);
    });
    quiz.appendChild(card);
  });
}

function gradeQuiz(){
  let correct=0;
  state.forEach((s,i)=>{
    if(s.selected===QUESTIONS[i].answer) correct++;
    s.revealed=true;
  });
  const pct=Math.round(correct/QUESTIONS.length*100);
  scoreText.textContent=`Score: ${correct}/${QUESTIONS.length} (${pct}%)`;
  result.textContent=`You answered ${correct} of ${QUESTIONS.length} correctly.`;
  result.style.display='block';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

gradeBtn.onclick=gradeQuiz;
resetBtn.onclick=resetQuiz;
studyMode.onchange=()=>{
  state.forEach(s=>s.revealed=false);
  scoreText.textContent='Score: —';
  result.style.display='none';
  render();
};

resetQuiz();
</script>
</body>
</html>
