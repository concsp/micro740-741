const bank=[{"category":"307 Shf/Wgs","question":"How do you acquire the satellite?","answer":"Take SAA fill in information on mod, demod, up-convertor and down-convertor, select satellite in accordance with SAA, Enter SMAT and ring seed in ESEM","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"How do you check if the terminal is using the HPA or MPA?","answer":"Operational commands and then setup AMP","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"How do you conduct a power balance?","answer":"Call the Gateway","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"How do you input the frequency on the terminal?","answer":"Set up up-convertor and down-convertor/mod. and demod.","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"How do you setup an external loop on the KIV-7M and what should you check for in ADNS?","answer":"Go to ext loop","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"How do you take the terminal out of dummy load for the HPA or MPA?","answer":"Ensure the beam state is on and change the Comm. Mode","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"How many days prior does a SAR need to be submitted?","answer":"45 Days Prior to Underway","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"List EBEM settings","answer":"Sub Mode, Data Rate, Mode, IF Offset/IF carrier Frequency, Serial Rate, Inner Code/Inner Code Rate, Timing Source, Buffer Size (iridium crystal timing) Reference SAA","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"List Reasons to conduct power balance","answer":"Low Eb/High Eb No eb Balance Resources","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"List antenna for WGS","answer":"USC-69=CBSP OE-581=GBS AS-4514=DSCS","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"What are you checking for in ADNS when any loop test is being conducted?","answer":"Lineup protocol down loop","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"What bands does WGS use and what are their ranges?","answer":"KA=26.5-40.0 X=8.2-12.4 C=5.85-8.20 Ghz","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"What does BERT stand for?","answer":"Bit Error Rate Test","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"What does EBEM stand for?","answer":"Enhanced Bandwidth Efficient Modem","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"What does ESEM stand for and what does it do?","answer":"Enhanced Service Efficient Modem Provides own encryption","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"What does FOM stand for and what is it used for?","answer":"Fiber Optic Media convertor Converts fiber to copper or serial","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"What information can be found on an SAA?","answer":"Mission Number, Operating bands, EBEM Settings, Gateway Settings, Satellite Data Base Number","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"What is a GAR? GAA?","answer":"GBS Access Request GBS Access Authorization","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"What is a SAR? SAA?","answer":"Satellite Access Request Satellite Access Authorization","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"What is a bi-directional loop?","answer":"Sends data to self and to station","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"What is an AAR and how many days do you have to submit?","answer":"After Action Report 72 Hours","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"What is an Up-convertor and a Down-convertor?","answer":"Up-convertor is symbolic to modulator Down-convertor is symbolic to Demodulator","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"What is the FIREBERD?","answer":"Communication analyzer, in house Q.A. checks Setting for FIREBERD Data, Gen Clock, timing, set up interface","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"What is the nomenclature for the WGS terminal?","answer":"WSC-6(V)5A","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"Who do we send the C4I report to and at what times?","answer":"To the Gateway at 0400Z, 1200Z, 2000Z","source":"Study guide PDF","status":"review"},{"category":"307 Shf/Wgs","question":"Why can we have two WGS missions?","answer":"We have two EBEMS","source":"Study guide PDF","status":"review"},{"category":"Communications","question":"How many data bits are in a Link-16 data word?","answer":"70","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Communications","question":"In which Link-11 mode can carrier suppression be tested?","answer":"Net Sync","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Communications","question":"In which mode must the DTS operate for a single-station POFA?","answer":"POFA TEST mode","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Communications","question":"On which band does the AN/FSC-79 SATCOM terminal transmit?","answer":"SHF","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Communications","question":"What DTS function protects transmitted information from errors?","answer":"Error detection and correction","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Communications","question":"What is the minimum number of broadcast channels NAVMACS guards automatically?","answer":"Four","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Communications","question":"What three interrupts should a single-station POFA print, in order?","answer":"Prepare to transmit, prepare to receive, end of receive.","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Communications","question":"Which Link-11 signal corrects errors caused by relative motion?","answer":"The Doppler tone","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Communications","question":"Which Link-4A test message lets aircraft verify proper Link-4A operation?","answer":"The universal test message.","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Content Indicator Codes","question":"Inport ? Log then route to CDO","answer":"How do you route a P4 message? Log then route to CO Admin Where do you get the PAC number for CUDIXS from?2301 What does NTP stand for? Naval Telecommunications Publication How do you enter a port on the DAMA? *9 then Desired Port Number How do you exit a port on the DAMA? *6 How do you check for the Guard Number? *2 What does TBA stand for? Terminal Based Address How do you enter a Guard Number? *1 Then Desired Guard Number How do you delete a Guard Number? *4 How do you connect a call on the DAMA? #76 then Guard Number of Desired Circuit How do you disconnect a call on the DAMA? #4","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"Describe the differences between loading black keys and red operational keys?","answer":"Red operational keys are already encrypted , Black keys need the RED UNIQUE to encrypt them.","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"For an LDR voice net, what do you need to know about timeslots for all users on the net to communicate?","answer":"Can't let it auto select if ARG wants to communicate, If you use timeslot 7, you will be allocating all the data to one circuit.","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"How do you format A-data and E-data?","answer":"Delete all Misc. letters until it looks like EHF Handbook.","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"How many LDR ports are there?","answer":"MDR? There are 12 Ports for LDR. 4 Prim. W/max 2400bps, 4 Sec. W/max 300bps, 4 RCV ports W/max 2400bps. There are 16 ports for MDR.","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"How many LDR timeslots are there?","answer":"7. MDR? 237.","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"List 7 things required to bring up EHF?","answer":"Timing, Crypto, Navigation, Ephemeris Data, Adaptation Data, Dry Air, Chilled Water","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"List CCI for EHF?","answer":"KYV-5, KIV-7M, KGV-11.","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"List EHF antenna and locations?","answer":"Two AS-4294; On top PRIFLY, On SPN-35 platform.","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"Nomenclature of EHF terminal?","answer":"USC-38(v)2","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What are MDR ports 15 and 16 used for?","answer":"15 = DSVT, 16 =T1\u2026These are both not used by us.","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What are the black keys and their classification?","answer":"Unclas ; TAC-1, Cover, & Downlink.","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What are the red operational keys?","answer":"EHF SKL KEYS","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What beam is used for LDR?","answer":"Uses Earth Coverage beam W/ a 17.5\u02da wide beam","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What does DUCA stand for?","answer":"NSB? Distributed User Coverage Antenna & Nueller Spot Beam","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What does XMT/RCV; XMT/RCV mean?","answer":"We are up on LDR/MDR.","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What does forced mean in regards to timeslots?","answer":"Assigned","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What does the KYV-5 limit the data rate to?","answer":"2400.","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What is A-data?","answer":"Adaptation Data \u2212 What is System-data? Defines which satellites are out there and which ones you can join. \u2212 What is Terminal-data? Gives ships specific Terminal ID (Ships terminal I.D can be found in EHF Handbook) and defines block zones for the ship.","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What is ATIP?","answer":"Advanced TDMA Interface Process","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What is E-data?","answer":"Satellite position and velocity, Good for 42 days on MIL*, Will update on its own if the satellite is acquired, May still acquire if stale but may take longer.","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What is SOL?","answer":"Sequential Order List","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What is Subnet A and B for CT TIP?","answer":"Subnet A is shore side always RCV Only. Subnet B is our station so we set it to TX/RCV.","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What is TAC 1 used for?","answer":"Allows access to satellite beams. Cover? Privilege level used to control satellite and communication functions . Downlink? Common to all satellite beams","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What is an ESP and what information is on it?","answer":"EHF Service Plan","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What is crosslinking?","answer":"Expand Range by going STATION-SAT-SAT-STATION.","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What is initial binding?","answer":"Binding of two terminals to INT OTAR 304/TECH OPERATOR STUDY GUIDE","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What is predicted SNR vs. measured SNR?","answer":"Predicted is based on terminal type & Antenna Type. Measured is the current situation.","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What is required before you can acquire MDR?","answer":"LDR","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What is special about the data rate for CT TIP?","answer":"When more than one person is on the net, the bandwidth is allocated equally.","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What is the red unique key used for?","answer":"Encrypts the black keys","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What navigational inputs are required?","answer":"Lat/Long: Manually entered, Heading: SINS(Shipboard Internal Navigation System)(WSN-7),Speed: Manually entered ,Pitch/Roll: SINS (WSN-7)","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What should the status of the HPA display when in IDLE?","answer":"From HPA Dummy Load means no TX.","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What type of MDR beam would we use?","answer":"Uses Nuller Spot Beam & Distributed User Coverage Antenna. NSB is 1\u02da wide (400 NM), and DUCA is 1\u02da wide (400 NM). Services Provided are; Dual Simplex for IP services, Voice Nets or PTP calls at 2400 bps, TIP (TMDA Interface Processor) for IP services.","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What type of cooling is used for EHF?","answer":"Chilled Water","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"What type of multiplexing does EHF use?","answer":"Time Division Multiple Access","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"Where can you find a list of all Terminal ID's?","answer":"EHF Handbook.","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"Who establishes the SOL for a net?","answer":"The 1st Terminal to come up on the net is established by default.","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"Why are LDR timeslots not assigned on the ESP?","answer":"Minimal amount and Lead of ARG or SG assigns it typically.","source":"Study guide PDF","status":"review"},{"category":"Ehf","question":"used to control satellite and communication functions . Downlink? Common to all","answer":"What is the red unique key used for? Encrypts the black keys What are the red operational keys? EHF SKL KEYS Describe the differences between loading black keys and red operational keys? Red operational keys are already encrypted , Black keys need the RED UNIQUE to encrypt them. What navigational inputs are required? Lat/Long: Manually entered, Heading: SINS(Shipboard Internal Navigation System)(WSN-7),Speed: Manually entered ,Pitch/Roll: SINS (WSN-7) What is A-data? Adaptation Data","source":"Study guide PDF","status":"review"},{"category":"Fiber Optics","question":"A coupler with one input and several outputs is what type?","answer":"A tree splitter","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Fiber Optics","question":"A coupler with two inputs and one output is what type?","answer":"An optical combiner","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Fiber Optics","question":"How is the center hole created in a ceramic ferrule?","answer":"The ferrule is formed around a precision wire.","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Fiber Optics","question":"What approximate wavelength range is used for glass optical fiber?","answer":"700 to 1600 nm","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Fiber Optics","question":"What are the two main parts of a fiber-optic receiver?","answer":"An optical detector and signal-conditioning circuits.","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Fiber Optics","question":"What is direct placement of a fiber end face over the source-emitting region called?","answer":"Butt coupling","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Fiber Optics","question":"What is receiver sensitivity?","answer":"The minimum optical power required to achieve a specified receiver performance.","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Fiber Optics","question":"What kind of lightwaves does incoherent light have?","answer":"Lightwaves lacking a fixed-phase relationship.","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Fiber Optics","question":"What polishing method lets mating fibers physically touch?","answer":"Physical-contact polish","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Fiber Optics","question":"Which cable design is preferred for low-density Navy shipboard applications?","answer":"OFCC cable","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Fiber Optics","question":"Which documents contain standard fiber-optic component/system test methods?","answer":"EIA/TIA-455 and EIA/TIA-526","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Fiber Optics","question":"Which factor does not affect current generated by a photodiode?","answer":"The data rate of the incoming optical signal.","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Fiber Optics","question":"Which fiber properties most affect system performance?","answer":"Core diameter and numerical aperture (NA).","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Fiber Optics","question":"Which material should not be used as a strength IT1 Mock Exam","status":"review"},{"category":"Hardware","question":"Which printer technology can produce photographic-quality continuous-tone images?","answer":"Dye-sublimation","source":"Quizlet - IT1 Mock Exam","status":"review"},{"category":"Hf","question":"Describe USB, LSB, and ISB?","answer":"Upper Side Band, Lower Side Band, Intermediate Side Band","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"How do you check for the Guard Number?","answer":"*2","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"How do you connect a call on the DAMA?","answer":"#76 then Guard Number of Desired Circuit","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"How do you delete a Guard Number?","answer":"*4","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"How do you disconnect a call on the DAMA?","answer":"#4","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"How do you enter a Guard Number?","answer":"*1 Then Desired Guard Number","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"How do you enter a port on the DAMA?","answer":"*9 then Desired Port Number","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"How do you exit a port on the DAMA?","answer":"*6","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"How do you route a P4 message?","answer":"Log then route to CO Admin","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"How do you route an AMCROSS message underway?","answer":"Log then Hand route to CHAPS Inport ? Log then route to CDO","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"How do you send an OTO on NAVMACS?","answer":"NPM DE NBHR SENDING OTO TO RAISE R/R\u2026K/JJA","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"How would you write Format line 2?","answer":"RTTUZYUW RXXXXXX0000 3652301-UUUU  and what is it?","answer":"Address Indicator Group; 2 or 3 PLA's in a group for tactical purposes","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"What does C2OIX stand for?","answer":"Command & Control Official Information Exchange","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"What does CAD stand for and what is it?","answer":"Collective Address Designator; 4 or more PLA's in a group for strategic ops.","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"What does CIC stand for?","answer":"CONTENT INDICATOR CODES ZYUW- GenAdmin; NGCN- Casrep; NBAT- Ammo; ZDKW- Retransmit; ZYVW- Service; ZYUM- Moverep; ZELX- Correction; ZBKW- Cancellation","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"What does CUDIXS stand for?","answer":"Common User Digital Information Exchange Sub- System","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"What does DPVS stand for?","answer":"Distributed PLA Verification System","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"What does DSRI stand for?","answer":"Designation Station Routing Indicator","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"What does EMCON stand for and what is it?","answer":"Emission Control Turning radiation off on the transmitters","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"What does EPIRB stand for?","answer":"Emergency Positioning Indicating Radio Beacon","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"What does NAVMACS stand for?","answer":"Naval Modular Automated Communications System","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"What does NTP stand for?","answer":"Naval Telecommunications Publication","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"What does OSRI stand for?","answer":"Originating Station Routing Indi ,"status":"review"},{"category":"Hf","question":"Which radio is used for HF SAR?","answer":"RT-1694","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"Who sets HERO?","answer":"OHO","source":"Study guide PDF","status":"review"},{"category":"Hf","question":"Who uses LINK 11?","answer":"DPC","source":"Study guide PDF","status":"review"},{"category":"Infocon.","question":"Describe the following Conditions and when each one is set.","answer":"OPSECON - Used to set internet capabilities for users. RIVERCITY - Used during emergency situations to limit information being released. EX: Man Overboard, GQ, Med-Evac, etc. EMCON - Used to reduce telecommunication signatures being sent off the ship. Set when needed to disguise ourselves. Explain the following Network Security: Access List - A list that grants access to cleared personnel in protected spaces. Firewall - A software or hardware-based network security system that controls the incoming and outgoing network traffic Consolidated AfloatNetworks&EnterpriseServices","source":"Study guide PDF","status":"review"},{"category":"Infocon.","question":"Describe the following Microsoft components:","answer":"TMG (Threat Management Gateway) - A network firewall that controls incoming and outgoing traffic. Home Drive - An external storage drive that provides users additional space for files. Share Drive - A network storage drive that stores files for the whole command.","source":"Study guide PDF","status":"review"},{"category":"Infocon.","question":"What are the four IP classes and range used by DoD?","answer":"Class A: 1.X.X.X - 127.X.X.X Class B: 127.X.X.X - 191.X.X.X Class C: 192.X.X.X - 223.X.X.X Class D: 224.X.X.X - 254.X.X.X","source":"Study guide PDF","status":"review"},{"category":"Infocon.","question":"What does a VLAN do?","answer":"VLAN(Virtual Local Area Network) - Segments the network so that other users can participate in their own network. An example of this is when marines ride the BHR network, yet have their own marine network. Know the following ports: FTP (File Transfer Protocol) - 20/21 SSH (Secure Shell) - 22 Telnet - 23 SMTP (Simple Mail Transfer Protocol) - 25 DNS (Domain Name Service/System) - 53 HTTP (Hypertext Transfer Protocol) - 80 POPv3 (Post Office Protocol Version 3) - 110 HTTPS (Hypertext Transfer Protocol Secure) - 443","source":"Study guide PDF","status":"review"},{"category":"Infocon.","question":"What does the following servers do?","answer":"File Server - Holds and distributes files. Mail Server - Allows commands to send and receive emails. DNS Server - Translates host names to IP addresses. Web Server - Allows users to web browse. Print Server - Manages all print devices on the network.","source":"Study guide PDF","status":"review"},{"category":"Infocon.","question":"What is ASI?","answer":"ASI (Authorized Service Interruption) - A coordinated downtime/maintenance window with potential of impacting the network. EX: Weekly Reboots","source":"Study guide PDF","status":"review"},{"category":"Infocon.","question":"What is CAS?","answer":"Collaboration at Sea - Web based application to post mission essential information for user with low bandwidth consumption.","source":"Study guide PDF","status":"review"},{"category":"Infocon.","question":"What is ISNS?","answer":"ISNS (Integrated Shipboard Network System) - A high-speed information network that provides communications to personnel.","source":"Study guide PDF","status":"review"},{"category":"Infocon.","question":"What is MIRC?","answer":"MIRC (Microsoft Internet Relay Chat) - SIPR chat.","source":"Study guide PDF","status":"review"},{"category":"Infocon.","question":"What is OWA?","answer":"OWA (Outlook Web Access) - Allows access to an email account remotely through the Internet.","source":"Study guide PDF","status":"review"},{"category":"Infocon.","question":"What is RADMERC?","answer":"RADMERC (Radiant Mercury) - Classes and declasses information to different systems.","source":"Study guide PDF","status":"review"},{"category":"Infocon.","question":"What is RAID?","answer":"RAID (Redundant Array of Independent Disks) - Provides data redundancy or performance improvement.","source":"Study guide PDF","status":"review"},{"category":"Infocon.","question":"What is What's Up Gold?","answer":"What's Up Gold - Is a software that monitors network devices and shows the current status of the network.","source":"Study guide PDF","status":"review"},{"category":"Infocon.","question":"What is the difference between HTTP and HTTPS?","answer":"HTTP is unsecure while HTTPS is secure.","source":"Study guide PDF","status":"review"},{"category":"Iw Systems And Networks","question":"Access List - A list that grants access to cleared personnel in protected spaces. Firewall - A software or hardware-based network security system that controls the incoming and outgoing network traffic Consolidated AfloatNetworks&EnterpriseServices 1. What is CAS?","answer":"What is WRBS, what type of info does it broadcast? a. CAS = Collaboration at Sea. WRBS = wireless reach back system. Used to capture biometrics/identify suspects 2. What is Sailor 2.1 and who supports it? a. Website for submitting trouble tickets to SPAWAR 3. How many enclaves are supported on the CANES Network? a. 4 = UNCLAS, SECRET, SCI, Secret Releasable 4. What/Where are NCTAMS? How many master stations? a. Naval Computer Telecommunications Area Master Station. Located in Hawaii and Virginia b. Provides communication system support to shore and afloat units 5. Which Enclave is used for the primary warfighter? a. SECRET/SIPR is used for primary warfighting 6. What racks are used in CANES? a. Backbone rack (hosts backbone switch), Data Center Rack (VMs), Edge Switch Racks (connection to end user) , and VTC( VideoTeleConference) Racks 7. What enclave is MAC-1 Failover used on? a. SECRET/SIPR 8. Network Topologies: a. Star topology - all computers and devices are connected to a main hub or switch. The hub or switch amasses and disburses the flow of data within the network. Star topology is the most common type of network and follows the Ethernet standard. b. Bus topology - in this arrangement computers and devices are connected to a single linear cable called a trunk. The trunk is also referred to as the backbone or a segment. Each end of the trunk must be discharged to prevent the signal from rebounding back up the cable. c. Ring topology - computers and devices are connected to a closed loop cable. Here there are no terminating ends so if one system crashes the entire network goes down. Each computer functions as a repeater and charges the signal before sending it to the next station. d. Mesh topology: infrastructure nodes (i.e. bridges, switches and other infrastructure devices) connect directly, dynamically and non-hierarchically to as many other nodes as possible and cooperate with one another to efficiently route data from/to clients. 9. What replaced CENTRIX? a. SR 10. What are the Canes Architectural Domains: a. System Management (15), Core Enterprise (6), Computing Infrastructure (6), Network Communications (5), Information Assurance (2), Domain Level (1) 11. What does SR support? a. Coalition partners/allies 12. What do VTC racks host? a. VTC and VDS (on force level units) 13. Know difference between LAN Distribution, File Transfer and Video Distribution 14. What enclave uses wireless? a. UNCLAS 15. What layer of the OSI model is a switch found on? a. Layer 2 (filters by MAC address) 16. What layer of the OSI model is a router found on? a. Layer 3, uses ACLs (Access Control Lists) to filter 17. What server is the blackberry hosted on? a. BES, Blackberry Enterprise Suite 18. What is a SAN Switch? a. Makes a network of storage devices accessible to multiple servers 19. Office productivity is provided by? a. Microsoft 2010 Suite 20. What Raid is used in CANES? a. 5 21. How do routers allow access through the network? a. ACL's, Access Control Lists. Uses IP addresses","sou function start(){category=document.querySelector('#cat').value;mode=document.querySelector('#mode').value;size=+document.querySelector('#size').value;let p=bank.map((_,i)=>i).filter(i=>category==='All'||bank[i].category===category);if(mode==='weak')p=p.filter(i=>weak.includes(i));queue=shuffle(p).slice(0,Math.min(size,p.length));pos=0;score=0;picked=null;queue.length?question():alert('No questions in this set yet.')}
function question(){let q=bank[queue[pos]],choices=opts(q);app.innerHTML=`<section class="quiz"><div class="bar"><span style="width:${(pos+1)/queue.length*100}%"></span></div><div class="count"><span>${pos+1} / ${queue.length}</span><b>${score} correct</b></div><div class="tagrow"><span>${esc(q.category)}</span><span>${esc(q.source)}</span></div><h1>${esc(q.question)}</h1><div class="answers">${choices.map((o,i)=>`<button data-answer="${encodeURIComponent(o)}"><i>${String.fromCharCode(65+i)}</i><span>${esc(o)}</span></button>`).join('')}</div><div id="feedback"></div></section>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(decodeURIComponent(b.dataset.answer),q))}
function answer(o,q){if(picked)return;picked=o;let correct=o===q.answer,idx=queue[pos];if(correct){score++;weak=weak.filter(x=>x!==idx)}else if(!weak.includes(idx))weak.push(idx);sync();document.querySelectorAll('[data-answer]').forEach(b=>{let v=decodeURIComponent(b.dataset.answer);b.className=v===q.answer?'correct':v===o?'wrong':'dim'});document.querySelector('#feedback').innerHTML=`<div class="feedback"><b>${correct?'Correct':'Not quite'}</b><p>${esc(q.answer)}</p><button id="next">${pos+1===queue.length?'See score':'Next question'}</button></div>`;document.querySelector('#next').onclick=()=>{picked=null;if(++pos>=queue.length)finish();else question()}}
function finish(){app.innerHTML=`<section class="finish"><p class="kicker">SET COMPLETE</p><h1>${score}/${queue.length}</h1><p>${score/queue.length>=.8?'Solid run. Hit the weak bank once more.':'Run the weak bank next. Say each correct answer aloud.'}</p><button class="primary" id="again">Build another set</button></section>`;document.querySelector('#again').onclick=setup}sync();setup();
</script></body></html>
