<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legacy ISNS Review</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff}.wrap{max-width:920px;margin:auto;padding:18px}
header{position:sticky;top:0;background:#0f172af2;border-bottom:1px solid #334155;z-index:5}.meta{color:#94a3b8}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}.ctrl{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.primary{background:#38bdf8;color:#082f49}.secondary{background:#334155;color:white}.score{margin-left:auto;font-weight:700}
.card{background:#111827;border:1px solid #334155;border-radius:14px;padding:16px;margin:15px 0}.qnum{color:#7dd3fc;font-size:.85rem;font-weight:700}
.question{font-weight:700;font-size:1.05rem;line-height:1.45;margin:9px 0 12px}.choice{display:block;width:100%;text-align:left;background:#1f2937;color:#fff;border:1px solid #475569;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}
.choice.selected{outline:2px solid #38bdf8}.choice.correct{background:#14532d;border-color:#22c55e}.choice.wrong{background:#7f1d1d;border-color:#ef4444}
.note{color:#94a3b8;font-size:.85rem;margin-top:8px}#result{display:none;background:#172554;border:1px solid #2563eb;border-radius:12px;padding:14px;margin-top:16px;font-weight:700}
@media(max-width:600px){.score{width:100%;margin-left:0}}
</style></head>
<body>
<header><div class="wrap"><h1>Legacy ISNS Review</h1><div class="meta">24 questions • wording lightly cleaned • multi-answer items preserved</div>
<div class="controls"><button class="ctrl primary" id="grade">Grade Quiz</button><button class="ctrl secondary" id="retake">Retake</button>
<label><input type="checkbox" id="study"> Study mode</label><span class="score" id="score">Score: —</span></div></div></header>
<main class="wrap"><div id="result"></div><div id="quiz"></div></main>
<script>
const Q=[{"q": "Which directory is typically accessed to obtain software tools and utilities?", "options": ["var", "usr", "bin", "etc"], "correct": [2], "multi": false}, {"q": "Which specific composed server provides core server services?", "options": ["DC-01", "DC-02", "APP-01", "FS-01"], "correct": [0], "multi": false}, {"q": "Which system is used by U.S. and allies that collaborate and share info up to Secret release level?", "options": ["CENTRIX", "GCCS-J", "ADNS", "NMCI"], "correct": [0], "multi": false}, {"q": "What CENTRIX multi-level thin client task can admins perform on user accounts?", "options": ["Delete", "Reset", "Modify", "Export", "Lock and Unlock", "Archive", "Monitor or View", "Add"], "correct": [1, 6, 7, 2, 4], "multi": true}, {"q": "Which system functions as the routing hub for shipboard, submarine, and shore station LANs while managing RF resources?", "options": ["NTCSS", "ADNS", "CENTRIX", "NMCI"], "correct": [1], "multi": false}, {"q": "Which system is recognized as an enabling resource of FORCEnet architecture?", "options": ["C2OIX", "ADNS", "GCCS-J", "NTCSS"], "correct": [1], "multi": false}, {"q": "Which increment of ADNS applies to a single local system with equipment installed at 5 primary locations?", "options": ["INC II Shore (INC 2 Shore)", "INC IV Expeditionary", "INC I Ship", "INC III Shore"], "correct": [0], "multi": false}, {"q": "Which tab in software allows admin to enable interface and node monitoring and establish thresholds and alarms?", "options": ["Status tab", "Config tab", "Tools tab", "Monitor tab"], "correct": [1], "multi": false}, {"q": "Which major component of wireless reachback system is used to transfer biometric files from vessel of interest to host vessel?", "options": ["Access point", "Satellite modem", "Wireless bridge", "Wireless router"], "correct": [2], "multi": false}, {"q": "At which point does wireless reachback electronic fingerprint transmission file leave the reachback system through an external interface?", "options": ["Transfer to an ISNS workstation", "Transfer to an NTCSS server", "Transfer to a CMM", "Transfer to a DNS server"], "correct": [0], "multi": false}, {"q": "Which components make up the fiber optic FLLI?", "options": ["Fiber optic modem (FOM)", "Router", "Firewall", "CSU DSU", "Switch"], "correct": [3, 0], "multi": true}, {"q": "Which pier service organizes data into 53-byte cell units using digital signal technology?", "options": ["ADNS", "High speed FLLI", "Low speed FLLI", "C2OIX"], "correct": [1], "multi": false}, {"q": "Which entity interacts on a GCCS-J allowing all military branches to share an accurate geographic and force picture?", "options": ["Department of State", "Department of Defense", "Defense Information Systems Agency", "Department of Homeland Security"], "correct": [1], "multi": false}, {"q": "At which security classification will most GCCS machines operate?", "options": ["Secret", "Confidential", "Top Secret", "Unclassified"], "correct": [0], "multi": false}, {"q": "Which system is a suite of software and commercial off-the-shelf hardware to provide maintenance, inventory, supply, admin, and NMC operations?", "options": ["CENTRIX", "NTCSS", "NMCI", "ADNS"], "correct": [1], "multi": false}, {"q": "Which network is actively managed and monitored by NCTAMS PAC?", "options": ["C2OIX", "CENTRIX", "NMCI", "ADNS"], "correct": [2], "multi": false}, {"q": "Which system consists of a partnership between Navy and industry purchased by individual Navy commands?", "options": ["NMCI", "CENTRIX", "GCCS-J", "NTCSS"], "correct": [0], "multi": false}, {"q": "Which network type is connected to base area networks in the Navy Enterprise Network to form the NMCI physical infrastructure?", "options": ["PAN", "LAN", "MAN", "WAN"], "correct": [3], "multi": false}, {"q": "Which messaging system can be configured to deliver digitally signed/encrypted mail to mailboxes?", "options": ["GCCS-J", "C2OIX", "NTCSS", "NMCI"], "correct": [1], "multi": false}, {"q": "Which component for C2OIX provides graphical user interface?", "options": ["CENTRIX Portal", "GCCS Viewer", "GOES WebViews", "Exchange OWA"], "correct": [2], "multi": false}, {"q": "Which FLTNOC service provides packet filtering, firewalls, and VPN?", "options": ["Information Assurance (IA)", "Network Management", "Messaging", "Directory Services"], "correct": [0], "multi": false}, {"q": "Which servers are specifically included with the FLTNOC service equipment suite?", "options": ["Internal DNS", "External DNS", "External Mail", "Internal Mail", "DHCP"], "correct": [3, 0], "multi": true}, {"q": "Which procedure is used to check status of a pier connection state, neighbor state, etc.?", "options": ["ADNS Cisco CLI on the router", "NMCI portal", "NTCSS web console", "GCCS-J command line"], "correct": [0], "multi": false}, {"q": "Which mode allows nslookup command users to query name servers about various hosts and names?", "options": ["Diagnostic", "Recursive", "Interactive", "Batch"], "correct": [2], "multi": false}]; let S=[];
function reset(){S=Q.map(()=>({sel:new Set(),rev:false}));score.textContent='Score: —';result.style.display='none';render();}
function right(i){const a=[...S[i].sel].sort((x,y)=>x-y), b=[...Q[i].correct].sort((x,y)=>x-y);return a.length===b.length&&a.every((v,j)=>v===b[j]);}
function render(){
  quiz.innerHTML='';
  Q.forEach((q,i)=>{
    let c=document.createElement('section');c.className='card';
    c.innerHTML=`<div class="qnum">Question ${i+1} of ${Q.length}</div><div class="question">${q.q}</div>`;
    q.options.forEach((o,j)=>{
      let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+o;
      if(S[i].sel.has(j))b.classList.add('selected');
      if(S[i].rev){if(q.correct.includes(j))b.classList.add('correct');else if(S[i].sel.has(j))b.classList.add('wrong')}
      b.onclick=()=>{
        if(q.multi){
          S[i].sel.has(j)?S[i].sel.delete(j):S[i].sel.add(j);
          if(study.checked&&S[i].sel.size===q.correct.length)S[i].rev=true
        }else{
          S[i].sel.clear();S[i].sel.add(j);if(study.checked)S[i].rev=true
        }
        render()
      };
      c.appendChild(b)
    });
    if(q.multi){let n=document.createElement('div');n.className='note';n.textContent=`Select ${q.correct.length} answers.`;c.appendChild(n)}
    quiz.appendChild(c)
  })
}
grade.onclick=()=>{
  let n=0;
  S.forEach((s,i)=>{if(right(i))n++;s.rev=true});
  let p=Math.round(n/Q.length*100);
  score.textContent=`Score: ${n}/${Q.length} (${p}%)`;
  result.textContent=`You answered ${n} of ${Q.length} correctly.`;
  result.style.display='block';render();scrollTo({top:0,behavior:'smooth'})
};
retake.onclick=reset;
study.onchange=()=>{S.forEach(x=>x.rev=false);score.textContent='Score: —';result.style.display='none';render()};
reset();
</script></body></html>
