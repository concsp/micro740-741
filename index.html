<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alcatel Switch Review</title><style>body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff}.wrap{max-width:900px;margin:auto;padding:18px}header{position:sticky;top:0;background:#0f172af2;border-bottom:1px solid #334155;z-index:5}h1{margin:0 0 5px}.meta{color:#94a3b8}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}.ctrl{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#38bdf8}.secondary{background:#334155;color:white}.score{margin-left:auto;font-weight:bold}.card{background:#111827;border:1px solid #334155;border-radius:14px;padding:16px;margin:15px 0}.qnum{color:#7dd3fc;font-size:.85rem}.question{font-weight:700;font-size:1.05rem;margin:9px 0 12px}.choice{display:block;width:100%;text-align:left;background:#1f2937;color:white;border:1px solid #475569;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}.choice.selected{outline:2px solid #38bdf8}.choice.correct{background:#14532d;border-color:#22c55e}.choice.wrong{background:#7f1d1d;border-color:#ef4444}#result{display:none;background:#172554;border:1px solid #2563eb;border-radius:12px;padding:14px;margin-top:16px;font-weight:bold}@media(max-width:600px){.score{width:100%;margin-left:0}}</style></head>
<body><header><div class="wrap"><h1>Alcatel Switch Review</h1><div class="meta">13 questions • review wording lightly cleaned</div><div class="controls"><button class="ctrl primary" id="grade">Grade Quiz</button><button class="ctrl secondary" id="retake">Retake</button><label><input type="checkbox" id="study"> Study mode</label><span class="score" id="score">Score: —</span></div></div></header><main class="wrap"><div id="result"></div><div id="quiz"></div></main>
<script>const Q=[{"q": "Which of following is not considered a characteristic of Navy switches?", "options": ["Spanning Tree Protocol support", "VLAN support", "ADNS default gateways", "SNMP monitoring"], "answer": 2}, {"q": "When monitoring policy and security on switch which is not monitored?", "options": ["Security logs", "Password policy", "Authentication settings", "Access controls"], "answer": 0}, {"q": "When monitoring basic config option on switch what also monitored?", "options": ["Interface descriptions", "User accounts", "Boot image names", "VLAN names"], "answer": 1}, {"q": "Two ways to monitor", "options": ["FTP and TFTP", "SSH and Telnet", "WUG and SNMP", "HTTP and HTTPS"], "answer": 2}, {"q": "What command is used to list user accounts?", "options": ["display user", "show users", "list users", "show user"], "answer": 3}, {"q": "Which active component console port is supposed to view laptop?", "options": ["PSU", "SFP", "CMM", "NI"], "answer": 2}, {"q": "When an Alcatel switch is booted which directory is boot files loaded into RAM from?", "options": ["running", "working", "flash", "certified"], "answer": 0}, {"q": "What capacity is Alcatel 9700 switch with 2 working power supplies?", "options": ["2 CMMs and 4 NIMs", "2 CMMs and 8 NIMs", "4 CMMs and 8 NIMs", "1 CMM and 8 NIMs"], "answer": 1}, {"q": "In what directory is Alcatel 9760 default files stored after certified?", "options": ["certified", "working", "running", "flash"], "answer": 0}, {"q": "Which protocol is used by admin to access switch over Ethernet?", "options": ["SSH", "Telnet", "TFTP", "SNMP"], "answer": 0}, {"q": "STP primary function", "options": ["Prevent IP address conflicts", "Assign default gateways", "Encrypt Layer 2 traffic", "Prevent switching loops and Layer 2 broadcast storms"], "answer": 3}, {"q": "A VLAN is defined by what software group within a LAN?", "options": ["logical", "routed", "physical", "dynamic"], "answer": 0}, {"q": "Image, config and boot files stored in", "options": ["RAM", "Flash memory", "NVRAM", "ROM"], "answer": 1}];let S=[];function reset(){S=Q.map(()=>({s:null,r:false}));score.textContent='Score: —';result.style.display='none';render()}function render(){quiz.innerHTML='';Q.forEach((q,i)=>{let c=document.createElement('section');c.className='card';c.innerHTML=`<div class="qnum">Question ${i+1} of ${Q.length}</div><div class="question">${q.q}</div>`;q.options.forEach((o,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+o;if(S[i].s===j)b.classList.add('selected');if(S[i].r){if(j===q.answer)b.classList.add('correct');else if(S[i].s===j)b.classList.add('wrong')}b.onclick=()=>{S[i].s=j;if(study.checked)S[i].r=true;render()};c.appendChild(b)});quiz.appendChild(c)})}grade.onclick=()=>{let n=0;S.forEach((s,i)=>{if(s.s===Q[i].answer)n++;s.r=true});let p=Math.round(n/Q.length*100);score.textContent=`Score: ${n}/${Q.length} (${p}%)`;result.textContent=`You answered ${n} of ${Q.length} correctly.`;result.style.display='block';render();scrollTo({top:0,behavior:'smooth'})};retake.onclick=reset;study.onchange=()=>{S.forEach(x=>x.r=false);score.textContent='Score: —';result.style.display='none';render()};reset();</script></body></html>
