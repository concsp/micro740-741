<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CANES Midterm Review</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff}.wrap{max-width:920px;margin:auto;padding:18px}
header{position:sticky;top:0;background:#0f172af2;border-bottom:1px solid #334155;z-index:5}.meta{color:#94a3b8}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}.ctrl{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.primary{background:#38bdf8;color:#082f49}.secondary{background:#334155;color:white}.score{margin-left:auto;font-weight:700}
.card{background:#111827;border:1px solid #334155;border-radius:14px;padding:16px;margin:15px 0}.qnum{color:#7dd3fc;font-size:.85rem;font-weight:700}
.question{font-weight:700;font-size:1.05rem;line-height:1.45;margin:9px 0 12px}.choice{display:block;width:100%;text-align:left;background:#1f2937;color:#fff;border:1px solid #475569;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}
.choice.selected{outline:2px solid #38bdf8}.choice.correct{background:#14532d;border-color:#22c55e}.choice.wrong{background:#7f1d1d;border-color:#ef4444}
#result{display:none;background:#172554;border:1px solid #2563eb;border-radius:12px;padding:14px;margin-top:16px;font-weight:700}
@media(max-width:600px){.score{width:100%;margin-left:0}}
</style></head>
<body>
<header><div class="wrap"><h1>CANES Midterm Review</h1><div class="meta">25 questions • wording lightly cleaned • answers preserved</div>
<div class="controls"><button class="ctrl primary" id="grade">Grade Quiz</button><button class="ctrl secondary" id="retake">Retake</button>
<label><input type="checkbox" id="study"> Study mode</label><span class="score" id="score">Score: —</span></div></div></header>
<main class="wrap"><div id="result"></div><div id="quiz"></div></main>
<script>
const Q=[{"q": "What network centric framework guarantees end to end connectivity between shore, afloat and mobile naval forces?", "options": ["CENTRIX", "CANES", "NMCI", "ForceNet"], "answer": 3}, {"q": "Identify a naval vessel type that is designated as a recognized platform variant for CANES system?", "options": ["Amphibious Assault Ship (LHD)", "Aircraft Carrier (CVN)", "Guided Missile Cruiser (CG)", "Destroyer (DDG)"], "answer": 2}, {"q": "Which primary SIPR hosts the CANES component responsible for translating PC host names to IP addresses?", "options": ["FS-01", "DC-01", "DNS-01", "DC-02"], "answer": 1}, {"q": "Which specific network enclave is configured to permit interoperability and data sharing with allied coalition partners like NATO?", "options": ["NIPR", "SIPR", "CENTRIX", "SECREL (SR)"], "answer": 3}, {"q": "Tactical application such as Global Command and System Maritime operate on which enclave?", "options": ["Unclassified", "Coalition", "Secret", "Top Secret"], "answer": 2}, {"q": "What is the primary customer service entry website that connects fleet to shore infra and C4I providers?", "options": ["Fleet Support 24/7", "Navy 311", "C4I Help Desk", "Navy Portal"], "answer": 1}, {"q": "If you need to perform system troubleshooting, which chapter of CANES IETM should you reference?", "options": ["Chapter 7", "Chapter 3", "Chapter 5", "Chapter 9"], "answer": 0}, {"q": "What specific information does a MRC provide to a technician?", "options": ["Detailed procedures for performing maintenance requirements", "Only software license information", "Only troubleshooting flowcharts", "Only equipment serial numbers"], "answer": 0}, {"q": "When changes to AD schema are necessary which Admin account is only one that should be created Schema Admin Group permissions?", "options": ["Enterprise Admin", "Local Administrator", "Schema Operator", "Domain Admin"], "answer": 0}, {"q": "For which CANES service are admin duties strictly restricted to managing user accounts, system access and backups?", "options": ["DNS", "Database", "Virtualization", "DHCP"], "answer": 1}, {"q": "What technological concept allows admins to monitor and manage a computer as a single logical entity?", "options": ["Network Virtualization", "Server Clustering", "Network Segmentation", "Storage Virtualization"], "answer": 0}, {"q": "Which virtualization component must be manually configured and managed at the admin level independently for each ESXi host?", "options": ["Datastore", "Virtual Switches or vSwitch", "Resource Pool", "vCenter Cluster"], "answer": 1}, {"q": "Which system operating as a virtual machine offers centralized management for all ESXi hosts connected to the network?", "options": ["DC-01", "vSwitch", "vMotion", "DCSA"], "answer": 3}, {"q": "What category of network storage is designed to be accessible without any delay?", "options": ["Secondary", "Cold", "Archive", "Primary"], "answer": 3}, {"q": "What software tool is utilized to facilitate secure file transfers for CANES application like ACS, TACACS or NCBI?", "options": ["PuTTY", "TFTP", "FileZilla", "WinSCP"], "answer": 2}, {"q": "What network protocol manages the authentication process that permits users to successfully connect to the network?", "options": ["RADIUS", "TACACS+", "LDAP", "Kerberos"], "answer": 0}, {"q": "What network filtering component utilizes an organized table of permit and deny rules to control traffic?", "options": ["ACL", "QoS", "NAT", "VLAN"], "answer": 0}, {"q": "On the Secret and Unclass enclaves, what specific Cisco hardware model does Software 1 utilize as a physical firewall?", "options": ["FPR 2120 (Firepower)", "Catalyst 9300", "ISR 4331", "ASA 5505"], "answer": 0}, {"q": "What does the networking acronym NTP stand for?", "options": ["Node Timing Process", "Network Transfer Protocol", "Network Transport Process", "Network Time Protocol"], "answer": 3}, {"q": "What hardware device acts as the bridge connecting wireless CANES devices to the wired infrastructure?", "options": ["Wireless Controller", "Bridge Switch", "Router", "Wireless Access Point"], "answer": 3}, {"q": "Which virtual machine server name is responsible for syncing PDA and mobile devices with Microsoft Outlook?", "options": ["DC-01", "DCSA", "WSAV", "BES/BUEM"], "answer": 3}, {"q": "Regardless of a DNS record's designated TTL, what is the minimum default caching time in minutes on the WSAV server?", "options": ["15 minutes", "45 minutes", "60 minutes", "30 minutes"], "answer": 3}, {"q": "Which AAA standard protocol transmits auth traffic across CANES infra to manage both device and network access?", "options": ["TACACS+", "RADIUS", "SNMP", "Kerberos"], "answer": 1}, {"q": "What AD feature is used to enforce baseline security configs and filter settings onto CANES workstations?", "options": ["OU Delegation", "Security Groups", "Active Directory Sites", "Group Policy"], "answer": 3}, {"q": "Within the domain which Flexible Single Master Operation or FSMO acts as the authoritative network Time source?", "options": ["RID Master", "Infrastructure Master", "Primary Domain Controller Emulator", "Schema Master"], "answer": 2}]; let S=[];
function reset(){S=Q.map(()=>({s:null,r:false}));score.textContent='Score: —';result.style.display='none';render();}
function render(){
  quiz.innerHTML='';
  Q.forEach((q,i)=>{
    const c=document.createElement('section'); c.className='card';
    c.innerHTML=`<div class="qnum">Question ${i+1} of ${Q.length}</div><div class="question">${q.q}</div>`;
    q.options.forEach((o,j)=>{
      const b=document.createElement('button'); b.className='choice'; b.textContent=String.fromCharCode(65+j)+'. '+o;
      if(S[i].s===j)b.classList.add('selected');
      if(S[i].r){if(j===q.answer)b.classList.add('correct');else if(S[i].s===j)b.classList.add('wrong');}
      b.onclick=()=>{S[i].s=j;if(study.checked)S[i].r=true;render();};
      c.appendChild(b);
    });
    quiz.appendChild(c);
  });
}
grade.onclick=()=>{
  let n=0;S.forEach((s,i)=>{if(s.s===Q[i].answer)n++;s.r=true;});
  const p=Math.round(n/Q.length*100);score.textContent=`Score: ${n}/${Q.length} (${p}%)`;
  result.textContent=`You answered ${n} of ${Q.length} correctly.`;result.style.display='block';render();scrollTo({top:0,behavior:'smooth'});
};
retake.onclick=reset;study.onchange=()=>{S.forEach(x=>x.r=false);score.textContent='Score: —';result.style.display='none';render();};reset();
</script></body></html>
