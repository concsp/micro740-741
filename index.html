<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CANES Final Review</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff}.wrap{max-width:920px;margin:auto;padding:18px}header{position:sticky;top:0;background:#0f172af2;border-bottom:1px solid #334155;z-index:5}.meta{color:#94a3b8}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}.ctrl{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#38bdf8;color:#082f49}.secondary{background:#334155;color:white}.score{margin-left:auto;font-weight:700}.card{background:#111827;border:1px solid #334155;border-radius:14px;padding:16px;margin:15px 0}.qnum{color:#7dd3fc;font-size:.85rem;font-weight:700}.question{font-weight:700;font-size:1.05rem;line-height:1.45;margin:9px 0 12px}.choice{display:block;width:100%;text-align:left;background:#1f2937;color:#fff;border:1px solid #475569;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}.choice.selected{outline:2px solid #38bdf8}.choice.correct{background:#14532d;border-color:#22c55e}.choice.wrong{background:#7f1d1d;border-color:#ef4444}#result{display:none;background:#172554;border:1px solid #2563eb;border-radius:12px;padding:14px;margin-top:16px;font-weight:700}@media(max-width:600px){.score{width:100%;margin-left:0}}
</style></head><body>
<header><div class="wrap"><h1>CANES Final Review</h1><div class="meta">25 questions • wording lightly cleaned • answers preserved</div><div class="controls"><button class="ctrl primary" id="grade">Grade Quiz</button><button class="ctrl secondary" id="retake">Retake</button><label><input type="checkbox" id="study"> Study mode</label><span class="score" id="score">Score: —</span></div></div></header>
<main class="wrap"><div id="result"></div><div id="quiz"></div></main>
<script>
const Q=[{"q": "In the Linux file system what type of path name always begins at the root directory?", "options": ["Symbolic", "Relative", "Canonical", "Absolute"], "answer": 3}, {"q": "What type of account is categorized by role and privilege and is designed to perform automated background tasks?", "options": ["System Owner", "Local User", "Administrator", "Run As Service"], "answer": 3}, {"q": "What ship level utilizes ACS servers on both Secret and SCI enclaves?", "options": ["Force Level Ships", "Shore Commands", "Expeditionary Units", "Unit Level Ships"], "answer": 0}, {"q": "At what hourly interval do shipboard services automatically check in with local WSUS server?", "options": ["every 48 hours", "every 12 hours", "every 6 hours", "every 24 hours"], "answer": 3}, {"q": "Which virtual machine functions as the hub transport server within the CANES environment?", "options": ["DC-01", "EX-01", "DCSA", "BES/BUEM"], "answer": 1}, {"q": "Which DOD policy document identifies and categorizes cybersecurity work into special area categories?", "options": ["8500.01", "8140.01", "8510.01", "8570.01"], "answer": 1}, {"q": "Which specific McAfee module within HBSS is responsible for real-time discovery of rogue systems on the network?", "options": ["Device Control", "Host Intrusion Prevention", "Rogue System Detection", "Policy Auditor"], "answer": 2}, {"q": "Which suite of software tools gives sysadmins visibility into the security posture of CANES systems and networks?", "options": ["VRAM - Vulnerability Remediation Asset Manager", "HBSS - Host Based Security System", "SCAP - Security Content Automation Protocol", "ACAS - Assured Compliance Assessment Solution"], "answer": 3}, {"q": "For which two enclaves can ACAS be configured to auto upload scanner ports to VRAM?", "options": ["SCI and SIPR", "SCI and NIPR", "NIPR and SR", "SIPR and NIPR (Unclass and Secret)"], "answer": 3}, {"q": "What are the verifiable small data files that contain identity credentials to authenticate websites, people, and devices?", "options": ["Digital Certificates", "Hash Values", "Digital Signatures", "Security Tokens"], "answer": 0}, {"q": "Which file transfer protocol is specifically secure using Transport Layer Security TLS?", "options": ["TFTP", "SFTP", "FTPS", "SCP"], "answer": 2}, {"q": "In CANES Software 3 and 4 baselines which force point application is utilized by the CDS access service?", "options": ["Remote Desktop Gateway", "Secure Web Gateway", "Forcepoint Proxy", "Trusted Thin Client"], "answer": 3}, {"q": "Which CANES enclave does not support Voice over Secure IP or VOSIP operations on any platform?", "options": ["NIPR", "SR", "SCI", "SIPR"], "answer": 0}, {"q": "Which chat service architecture is based on centralized networking where communicating systems have equal status and responsibilities?", "options": ["Distributed Model", "Federated Model", "Peer-to-Peer Model", "Server Client Model"], "answer": 3}, {"q": "Which CANES enclave does not support video teleconference VTC capabilities?", "options": ["SR Secret Releasable", "SCI", "NIPR", "SIPR"], "answer": 0}, {"q": "What bridging device component at the force level supports external video teleconferencing?", "options": ["Video Router", "Session Border Controller", "Multipoint Control Unit", "Media Gateway"], "answer": 2}, {"q": "Which system service has the capacity to distribute an audio or video source to 80 or more set-top boxes STB throughout a ship?", "options": ["Video Distribution Service", "Voice Distribution Service", "Streaming Gateway Service", "Multimedia Relay Service"], "answer": 0}, {"q": "What overarching management approach is utilized for CANES system management?", "options": ["Distributed management and administration", "Centralized management and administration", "Local-only management", "Peer-to-peer management"], "answer": 1}, {"q": "What is the primary software management application used to document and track incidents in CANES SW1 and SW2?", "options": ["VMware vCenter", "HBSS ePO", "System Center Service Manager", "VMware Service Manager VSM"], "answer": 3}, {"q": "What specific event management tool is utilized within CANES SW1/SW2 baselines?", "options": ["ACAS", "VRAM", "ITOI", "HBSS"], "answer": 2}, {"q": "In the release management process which entity holds a responsibility to develop, build, and test new CANES systems?", "options": ["In-Service Engineering Agent ISEA", "Fleet Cyber Command", "Regional Maintenance Center", "Program Management Office PMO"], "answer": 0}, {"q": "Which type of SIEM rule is designed to match known vulnerability such as anti-virus signature rules?", "options": ["Correlation", "Anomaly", "Known Signature", "Behavioral"], "answer": 2}, {"q": "What is the primary objective of the fault isolation process?", "options": ["Restore network operation", "Perform a full system backup", "Replace all hardware", "Document all faults"], "answer": 0}, {"q": "During the remove/replace process which step involves informing crew members of planned outages and expected restoral time?", "options": ["Restoration", "Isolation", "Validation", "Notification"], "answer": 3}, {"q": "On a CVN class ship, which help desk is responsible for installing, maintaining, and repairing afloat tactical systems?", "options": ["Network Operations Center", "Electronic Data Processing EDP", "Combat Systems Help Desk", "Information Assurance Help Desk"], "answer": 1}];let S=[];
function reset(){S=Q.map(()=>({s:null,r:false}));score.textContent='Score: —';result.style.display='none';render()}
function render(){quiz.innerHTML='';Q.forEach((q,i)=>{const c=document.createElement('section');c.className='card';c.innerHTML=`<div class="qnum">Question ${i+1} of ${Q.length}</div><div class="question">${q.q}</div>`;q.options.forEach((o,j)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+o;if(S[i].s===j)b.classList.add('selected');if(S[i].r){if(j===q.answer)b.classList.add('correct');else if(S[i].s===j)b.classList.add('wrong')}b.onclick=()=>{S[i].s=j;if(study.checked)S[i].r=true;render()};c.appendChild(b)});quiz.appendChild(c)})}
grade.onclick=()=>{let n=0;S.forEach((s,i)=>{if(s.s===Q[i].answer)n++;s.r=true});const p=Math.round(n/Q.length*100);score.textContent=`Score: ${n}/${Q.length} (${p}%)`;result.textContent=`You answered ${n} of ${Q.length} correctly.`;result.style.display='block';render();scrollTo({top:0,behavior:'smooth'})};retake.onclick=reset;study.onchange=()=>{S.forEach(x=>x.r=false);score.textContent='Score: —';result.style.display='none';render()};reset();
</script></body></html>
